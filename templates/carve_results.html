<!doctype html><html><head><meta charset="utf-8"><title>DataResQ Carving Results</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="results-page"><a href="{{url_for('index')}}">← Back to DataResQ</a><h1>Deep Signature Carving</h1><p class="muted">Source: {{source}}</p><div class="table-wrap"><table><thead><tr><th>#</th><th>Offset</th><th>Size</th><th>Type</th><th>Confidence</th><th>SHA-256 sample</th><th>Action</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{loop.index}}</td><td>{{r.offset}}</td><td>{{r.size|filesize}}</td><td>{{r.extension}}</td><td>{{r.confidence}}%</td><td class="hash">{{r.sha256}}</td><td><a class="button" href="{{url_for('recover',index=loop.index0)}}">Recover</a></td></tr>{% else %}<tr><td colspan="7">No recognizable signatures found.</td></tr>{% endfor %}</tbody></table></div></main></body></html>
