<!doctype html><html><head><meta charset="utf-8"><title>DataResQ Scan Results</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="results-page"><a href="{{url_for('index')}}">← Back to DataResQ</a><h1>{{title}}</h1><div class="table-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Extension</th><th>Size</th><th>Status</th><th>SHA-256 sample</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.file_name}}</td><td>{{r.detected_type}}</td><td>{{r.extension}}</td><td>{{r.size|filesize}}</td><td>{{r.status}}</td><td class="hash">{{r.sha256}}</td></tr>{% else %}<tr><td colspan="6">No scan results.</td></tr>{% endfor %}</tbody></table></div></main></body></html>
